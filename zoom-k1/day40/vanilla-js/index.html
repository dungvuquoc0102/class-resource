<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script
      src="https://kit.fontawesome.com/595b46303d.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div
      class="w-150 mx-auto rounded-md bg-blue-300 place-items-center grid p-10"
    >
      <div class="text-9xl font-bold" id="count">0</div>
      <div>
        <button
          class="hover:cursor-pointer px-2 py-1 bg-blue-500 w-30 text-center rounded-md"
          id="minus"
        >
          <i class="fa-solid fa-minus"></i>
        </button>
        <button
          class="hover:cursor-pointer px-2 py-1 bg-blue-500 w-30 text-center rounded-md"
          id="reset"
        >
          Reset
        </button>
        <button
          class="hover:cursor-pointer px-2 py-1 bg-blue-500 w-30 text-center rounded-md"
          id="add"
        >
          <i class="fa-solid fa-plus"></i>
        </button>
        <button
          class="hover:cursor-pointer px-2 py-1 bg-blue-500 w-30 text-center rounded-md"
          id="unsubscribe"
        >
          Unsubscribe
        </button>
      </div>
    </div>
    <script src="script.js" type="module"></script>
  </body>
</html>
