<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Live code editor</title>
  </head>
  <body>
    <div>
      <a href="https://f8/.edu.vn" target="_blank">F8</a>
      <h1 class="text-2xl font-bold">Live code editor</h1>
      <div class="editor-container h-[calc(100vh-2rem)] flex">
        <!-- Editor code -->
        <div class="editor-code flex flex-col w-1/2 h-full bg-gray-300">
          <div class="">Code</div>
          <div class="flex flex-1">
            <div class="editor-column w-10 px-2">
              <div class="text-right">1</div>
              <div class="text-right">2</div>
            </div>
            <textarea
              name=""
              id=""
              class="editor-textarea inline-block flex-1 h-full bg-gray-200 resize-none px-3"
            ></textarea>
          </div>
        </div>
        <!-- Editor preview -->
        <div class="w-1/2 h-full flex flex-col">
          <div class="bg-gray-200">Preview</div>
          <iframe src="" frameborder="0" class="flex-1 editor-preview"></iframe>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
