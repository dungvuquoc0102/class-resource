<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="border border-gray-300 p-4 rounded-lg bg-blue-50 max-w-100">
      <h1 class="text-center text-xl mb-4 text-blue-600">Register</h1>
      <form class="flex flex-col gap-4" id="form-register">
        <input
          class="border border-gray-300 px-3 py-2"
          type="text"
          name="username"
          placeholder="Username..."
        />
        <input
          class="border border-gray-300 px-3 py-2"
          type="email"
          name="email"
          placeholder="Email..."
        />
        <input
          class="border border-gray-300 px-3 py-2"
          type="password"
          name="password"
          placeholder="Password..."
        />
        <input
          class="border border-gray-300 px-3 py-2"
          type="text"
          name="display_name"
          placeholder="Display Name..."
        />
        <input
          class="border border-gray-300 px-3 py-2"
          type="text"
          name="bio"
          placeholder="Bio..."
        />
        <select class="border border-gray-300 px-3 py-2" name="country">
          <option value="VN" selected>Vietnam</option>
          <option value="US">United States</option>
        </select>
        <button
          class="w-fit bg-blue-300 text-blue-600 px-3 py-2 rounded-md hover:cursor-pointer"
        >
          Submit
        </button>
      </form>
    </div>
    <script>
      const formRegister = document.querySelector("#form-register");
      formRegister.addEventListener("submit", async (e) => {
        e.preventDefault();
        const formData = new FormData(formRegister);
        const data = Object.fromEntries(formData.entries());
        fetch("https://spotify.f8team.dev/api/auth/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        })
          .then((res) => res.json())
          .then((data) => {
            console.log(data);
            if (!data.error) {
              localStorage.setItem("access_token", data.access_token);
              localStorage.setItem("refresh_token", data.refresh_token);
              alert("Register successfully");
              window.location.href = "/k20/day29/index.html";
            } else {
              alert(data.error?.message);
            }
          });
        // .catch((err) => {
        //   console.log(err);
        // });
      });

      fetch("https://spotify.f8team.dev/api/users/me", {
        method: "GET",
        headers: {
          Authorization: `Bearer ${localStorage.getItem("access_token")}`,
        },
      })
        .then((res) => res.json())
        .then((data) => {
          if (data.user) {
            window.location.href = "/k20/day29/index.html";
          }
        });
    </script>
  </body>
</html>
