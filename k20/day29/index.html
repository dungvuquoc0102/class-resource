<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 29</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header>
      <div>Username: <span id="username"></span></div>
      <div>Email: <span id="email"></span></div>
      <button
        class="w-fit bg-blue-300 text-blue-600 px-3 py-2 rounded-md hover:cursor-pointer"
        id="logout"
      >
        Logout
      </button>
    </header>

    <script>
      fetch("https://spotify.f8team.dev/api/users/me", {
        method: "GET",
        headers: {
          Authorization: `Bearer ${localStorage.getItem("access_token")}`,
        },
      })
        .then((res) => res.json())
        .then((data) => {
          const username = document.querySelector("#username");
          const email = document.querySelector("#email");

          username.textContent = data.user.username;
          email.textContent = data.user.email;
        });

      const btnLogout = document.querySelector("#logout");
      btnLogout.addEventListener("click", () => {
        localStorage.removeItem("access_token");
        localStorage.removeItem("refresh_token");
        window.location.href = "/k20/day29/login.html";
      });

      fetch("https://spotify.f8team.dev/api/users/me", {
        method: "GET",
        headers: {
          Authorization: `Bearer ${localStorage.getItem("access_token")}`,
        },
      })
        .then((res) => {
          if (res.status === 401) {
            fetch("https://spotify.f8team.dev/api/auth/refresh-token", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${localStorage.getItem("refresh_token")}`,
              },
            })
              .then((res) => res.json())
              .then((data) => {
                localStorage.setItem("access_token", data.access_token);
                window.location.reload();
              });
          }
          return res.json();
        })
        .then((data) => {
          // if (!data.user) {
          //   window.location.href = "/k20/day29/login.html";
          // }
          console.log(data);
        });
    </script>
  </body>
</html>
